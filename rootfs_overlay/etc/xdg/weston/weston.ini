# Weston configuration, see weston.ini(5).
#
# transform values: normal, rotate-90, rotate-180, rotate-270,
# flipped, flipped-rotate-90, flipped-rotate-180, flipped-rotate-270
# (rotations are clockwise)
#
# HDMI-A-1 is the HDMI port closest to the power connector on the
# Pi 4/5; the other port is HDMI-A-2.
#
# app-ids pins which cog instance's window kiosk-shell places on that output
# (see BarBanker.Kiosk.Supervisor, which launches one cog process per
# app-id/URL pair) — swap the two app-ids below if the physical screens end
# up on the wrong ports.

#[core]
#shell=kiosk

[output]
name=HDMI-A-1
transform=rotate-90
app-ids=se.databladet.bar_banker.customer

[output]
name=HDMI-A-2
transform=rotate-90
app-ids=se.databladet.bar_banker.staff