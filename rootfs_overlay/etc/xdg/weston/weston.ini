# Weston configuration, see weston.ini(5).
#
# transform values: normal, rotate-90, rotate-180, rotate-270,
# flipped, flipped-rotate-90, flipped-rotate-180, flipped-rotate-270
# (rotations are clockwise)
#
# HDMI-A-1 is the HDMI port closest to the power connector on the
# Pi 4/5; the other port is HDMI-A-2.

#[core]
#shell=kiosk

[output]
name=HDMI-A-1
transform=rotate-90

#[output]
#name=HDMI-A-2
#transform=rotate-90